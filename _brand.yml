color:
  palette:
  # primary colours
    nhssdarkblue: "#002D72"	
    nhsslightblue: "#0077C8"
    dark-grey: "#425563"
    
   # secondary -  for interest and personality
   # relying on internet descriptions for some of these names
   
    nhssdarkred: "#A6192E"
    nhssred: "#D22730"
    nhssmagenta: "#AC145A"
    nhssmauve: "#59315F"
    nhsspurple: "#87189D"
    nhssdarkpurple: "#221C35"
    nhssdarkteal: "#004F59" # a.k.a. kali blue
    nhssteal: "#007D8A"  # a.k.a. metallic seaweed
    nhssdarkgreen: "#006341" # verdant green or ataoke bamboo
    nhssgreen: "#008755"

    # accent colours for occasional use
    nhssyellow: "#F2CD00"
    nhssorange: "#ED8B00"
    nhsspink: "#DA1984"
    nhsslimegreen: "#78BE21"
    nhssturquoise: "#2CCCD3"
   
   
    white: '#FFFFFF'
    black: '#231F20'
    
  foreground: black
  background: white
  primary: nhssdarkblue
  secondary: dark-grey
  tertiary: nhsslightblue
  success: nhssgreen
  danger: nhssred
  warning: nhssyellow
  info: nhsslightblue
  light: nhsspink # definitely wonky
  dark: dark-grey

logo:
  # Download the NHS Scotland logo 
  images:
    nhss-logo:
      path: src/NHS_SC_cmyk.png
      alt: NHS Scotland logo
    nhss-logo-white:
      path: src/NHS_SC_neg.png
      alt: NHS Scotland logo
  small: nhss-logo-white
  medium: nhss-logo
  large: nhss-logo


typography:
  fonts:
    - family: Source Sans Pro
      source: google

    - family: Arial
      source: system

  base:
    family: Source Sans Pro, Arial, sans-serif
    line-height: 1.5

  headings:
    family: Source Sans Pro, Arial, sans-serif
    weight: 700
    line-height: 1.25
    color: nhssdarkblue
